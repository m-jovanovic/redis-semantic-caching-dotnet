name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8.2.3
        ports: ["6396:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build RedisSemanticCache.slnx
      - run: dotnet test RedisSemanticCache.slnx --no-build
